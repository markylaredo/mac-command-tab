name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          xcodebuild test \
            -project MacCommandTab.xcodeproj \
            -scheme MacCommandTab \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
